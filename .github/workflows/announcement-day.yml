name: Announcement-day check
# The Bank of Canada announces its policy rate on Wednesdays at 9:45 ET. Every 10 minutes on Wednesday daytimes,
# this checks the Bank's own press release; when it shows a rate the site doesn't have yet, it starts the
# "Update rates" run right away. (The prime rate comes only from the Bank's weekly figure.)
on:
  schedule:
    - cron: "*/10 13-21 * * 3"   # Wednesdays, 9:00 to 17:50 Toronto time (EDT); 8:00 to 16:50 in winter (EST)
  workflow_dispatch:
permissions:
  actions: write
  contents: read
concurrency:
  group: announcement-day
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install requests beautifulsoup4 pyyaml
      - name: Check for a new policy rate, and update the site if there is one
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if python scraper.py --announcement-check; then
            if gh run list --workflow update-rates.yml --status in_progress --json databaseId --jq 'length' | grep -qv '^0$'; then
              echo "An update is already running; it will pick this up."
            else
              gh workflow run update-rates.yml --ref main
            fi
          fi
