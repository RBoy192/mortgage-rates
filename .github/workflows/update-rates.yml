name: Update rates
on:
  schedule:
    - cron: "50 * * * *"   # every hour, 7 minutes past
  workflow_dispatch:       # adds a "Run workflow" button on the Actions tab
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: rates
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Install browser (only if a lender needs one)
        run: |
          if grep -qE "^[[:space:]-]+mode:[[:space:]]*browser" institutions.yaml; then playwright install --with-deps chromium; fi
      - name: Scrape rates
        id: scrape
        run: python scraper.py
        continue-on-error: true
      - name: Save rates.json to the repo
        run: |
          git config user.name "rates-bot"
          git config user.email "rates-bot@users.noreply.github.com"
          git add rates.json
          git diff --cached --quiet || (git commit -m "Update rates" && git push)
      - name: Build site folder
        run: mkdir site && cp *.html *.css *.js rates.json site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Fail (so GitHub emails you) if any lender failed
        if: steps.scrape.outcome == 'failure'
        run: exit 1
