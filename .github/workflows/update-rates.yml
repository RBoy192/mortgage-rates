name: Update rates
on:
  schedule:
    - cron: "50 * * * *"   # every hour at :50 (if your file has a different schedule you prefer, keep yours)
  workflow_dispatch:       # adds a "Run workflow" button on the Actions tab
permissions:
  contents: write
  issues: write
  pages: write
  id-token: write
concurrency:
  group: rates
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Test the scraper
        run: python -m unittest discover -s tests -v
      - name: Install browser (only if a lender needs one)
        run: |
          if grep -qE "^[[:space:]-]+mode:[[:space:]]*browser" institutions.yaml; then playwright install --with-deps chromium; fi
      - name: Keep a copy of the previous rates (to spot changes)
        run: cp rates.json /tmp/rates.prev.json || echo '{}' > /tmp/rates.prev.json
      - name: Scrape rates
        id: scrape
        run: python scraper.py
        continue-on-error: true
      - name: Save rates.json and history.json to the repo
        run: |
          git config user.name "rates-bot"
          git config user.email "rates-bot@users.noreply.github.com"
          git add rates.json history.json
          git diff --cached --quiet || (git commit -m "Update rates" && git push)
      - name: Rate-change feed (feed.xml)
        run: python feed.py
        continue-on-error: true
      - name: Build site folder
        run: mkdir site && cp *.html *.css *.js *.svg *.png *.ico *.xml *.txt *.webmanifest rates.json history.json site/ && cp -r fonts site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Open, update or close the "Rates need attention" issue (GitHub emails you when it opens or changes)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python alert.py
      - name: Keep evidence of rate changes (private repository, not published)
        if: always()
        continue-on-error: true
        timeout-minutes: 20
        env:
          EVIDENCE_TOKEN: ${{ secrets.EVIDENCE_TOKEN }}
          EVIDENCE_REPO: ${{ vars.EVIDENCE_REPO || 'RBoy192/rate-evidence' }}
        run: |
          if [ -n "$EVIDENCE_TOKEN" ]; then
            git clone -q --depth 1 "https://x-access-token:${EVIDENCE_TOKEN}@github.com/${EVIDENCE_REPO}.git" evidence-repo || echo "evidence: couldn't open ${EVIDENCE_REPO}"
          fi
          python evidence.py /tmp/rates.prev.json
          if [ -d evidence-repo/.git ]; then
            cd evidence-repo
            git add -A
            git diff --cached --quiet || (git -c user.name="rates-bot" -c user.email="rates-bot@users.noreply.github.com" commit -qm "Evidence $(date -u +%F)" && git push -q)
          fi
