name: Diagnose lenders
# Started by hand. Tries the named lenders (comma-separated) and saves what happened to the "diagnose" branch.
# It doesn't change the live site.
on:
  workflow_dispatch:
    inputs:
      lenders:
        description: "Lender names, comma-separated"
        required: true
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium
      - name: Try each lender
        env:
          LENDERS: ${{ inputs.lenders }}
        run: |
          python - <<'PY' > report.txt 2>&1 || true
          import os, traceback, yaml, scraper
          from bs4 import BeautifulSoup
          conf = {l["name"]: l for l in yaml.safe_load(open("institutions.yaml"))}
          for name in [n.strip() for n in os.environ["LENDERS"].split(",")]:
              l = conf[name]; print("=====", name, l["url"])
              print("robots ok:", scraper.robots_ok(l["url"]))
              for browser in (False, True):
                  print("--- browser" if browser else "--- plain page")
                  try:
                      html = scraper.get_html(l["url"], browser)
                      soup = BeautifulSoup(html, "html.parser")
                      print("length", len(html), "| title:", soup.title.get_text(strip=True) if soup.title else None)
                      for item in scraper.active(l):
                          try: print(" ", item["product"], scraper.extract(soup, item))
                          except Exception as e: print(" ", item["product"], "ERROR", e)
                      text = " ".join(soup.get_text(" ").split())
                      for kw in ("special offer", "10-Year Closed", "Variable", "homeprime"):
                          i = text.find(kw); print("  near", repr(kw), ":", text[max(0, i - 150):i + 250] if i >= 0 else "not found")
                  except Exception:
                      traceback.print_exc()
          PY
          cat report.txt
          git config user.name "rates-bot"; git config user.email "rates-bot@users.noreply.github.com"
          git checkout --orphan diagnose; git rm -rqf --cached .; git add report.txt
          git commit -qm "Diagnose report"; git push -f origin diagnose
