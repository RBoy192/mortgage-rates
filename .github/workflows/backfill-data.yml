name: Backfill rate history from data files (one-off)
# Started by hand. Reads archived copies of the rate data files some lenders' pages load (see backfill_data.py)
# and commits backfill/report-data-<run>.csv for review. It doesn't change the live site or history.json.
on:
  workflow_dispatch:
    inputs:
      since:
        description: "Earliest date to read, YYYY-MM-DD"
        default: "2017-01-01"
permissions:
  contents: write
jobs:
  read:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python backfill_data.py "backfill/report-data-${{ github.run_id }}.csv" "${{ inputs.since }}"
      - name: Commit the report
        run: |
          git config user.name "rates-bot"; git config user.email "rates-bot@users.noreply.github.com"
          git add backfill/report-data-*.csv
          git commit -m "Data-file backfill report (for review)" || exit 0
          for i in 1 2 3 4 5; do
            if git pull --rebase -X theirs && git push; then exit 0; fi
            sleep $((i * 15))
          done
          exit 1
