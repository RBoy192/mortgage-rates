name: Explore lender rate pages (temporary)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  explore:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium
      - name: Explore
        run: |
          mkdir -p explore
          python - <<'PY' 2>&1 | tee explore/summary.txt
          import re, json, scraper
          from urllib.parse import urljoin, urlparse
          from playwright.sync_api import sync_playwright
          START = {
            "access": ["https://www.accesscu.ca/en/rates"], "steinbach": ["https://scu.mb.ca/rates"], "assiniboine": ["https://www.acu.ca/rates"],
            "duca": ["https://www.duca.com/rates"], "beem": ["https://www.blueshorefinancial.com/", "https://www.gffg.com/"],
            "tru": ["https://www.envisionfinancial.ca/", "https://www.islandsavings.ca/", "https://www.valleyfirst.com/"],
          }
          import requests
          for key, starts in START.items():
              for i, s in enumerate(starts):
                  try:
                      r = requests.get(s, headers={"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36"}, timeout=30)
                      print(f"{key}: plain {s} -> {r.url} [{r.status_code}] {len(r.text)} bytes")
                      open(f"explore/{key}-raw{i}.html", "w").write(r.text)
                  except Exception as e:
                      print(f"{key}: plain {s} failed {str(e)[:80]}")
          UA = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          def text_of(page):
              return page.evaluate("document.body ? document.body.innerText : ''")
          with sync_playwright() as pw:
              b = pw.chromium.launch()
              for key, starts in START.items():
                  pg = b.new_page(user_agent=UA)
                  for s in starts:
                      try:
                          r = pg.goto(s, wait_until="domcontentloaded", timeout=45000); pg.wait_for_timeout(5000)
                      except Exception as e:
                          print(f"{key}: {s} failed {str(e)[:80]}"); continue
                      body = text_of(pg); n = len(re.findall(r"\d\.\d{2,3}\s*%", body))
                      print(f"{key}: {s} -> {pg.url} status {r.status if r else None} title {pg.title()[:60]!r} %figures {n}")
                      open(f"explore/{key}-{starts.index(s)}.txt", "w").write(pg.url + "\n\n" + body)
                      links = pg.evaluate("[...document.querySelectorAll('a[href]')].map(a=>[a.href, (a.innerText||'').replace(/\\s+/g,' ').trim().slice(0,50)])")
                      for href, txt in sorted({(h, x) for h, x in links if re.search(r"rate|taux", h + " " + x, re.I)})[:30]:
                          print(f"   link {href} | {txt}")
                      try:
                          html = scraper.get_html(pg.url); print(f"   plain fetch: {len(re.findall(r'[0-9][.][0-9]{2,3}[ ]*%', html))} % figures in HTML, robots ok: {scraper.robots_ok(pg.url)}")
                      except Exception as e:
                          print("   plain fetch failed", str(e)[:80])
                  pg.close()
              b.close()
          PY
          git config user.name "rates-bot"; git config user.email "rates-bot@users.noreply.github.com"
          git checkout --orphan diagnose; git rm -rqf --cached .; git add explore
          git commit -qm "Lender pages"; git push -f origin diagnose
