name: Explore lender rate pages (temporary)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  explore:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium
      - name: Logo files
        run: |
          mkdir -p explore
          python - <<'PY' 2>&1 | tee explore/summary.txt
          import requests, re
          U = {"affinity.svg": "https://www.affinitycu.ca/images/default-source/default-album/affinity-cu-logo-rgb-chevron---for-website.svg?sfvrsn=63b5d980_4",
            "conexus.svg": "https://www.conexus.ca/getContentAsset/d7c3a8a8-0ce7-47ff-84d2-47a877629ca7/e477a59e-1df6-4e2f-9986-20ab37342540/favicon.svg?language=en-US",
            "libro.jpg": "https://www.libro.ca/uploads/2025/12/cropped-favicon-2025-180x180.jpg",
            "firstontario.png": "https://www.firstontario.com/wp-content/uploads/2026/02/apple-touch-icon.png",
            "firstontario.svg": "https://www.firstontario.com/wp-content/uploads/2026/02/favicon.svg",
            "uni.png": "https://www.uni.ca/UNIassetsEN/ico/uni114x114.png",
            "icici.ico": "https://www.icicibank.ca/favicon.ico", "icici.png": "https://www.icicibank.ca/content/dam/icicibank/canada/ICICI-Canada-LOGO.png",
            "access.svg": "https://www.accesscu.ca/media/1266/small-logo.svg", "access.ico": "https://www.accesscu.ca/media/2157/favicon2.ico",
            "acu.png": "https://www.acu.ca/hubfs/ACU_Digital-_RGB_Asterisk-only-1.png",
            "scu.svg": "https://scu.mb.ca/getContentAsset/5a857dfe-9852-4124-b5ab-58cd8501ec0b/dfc3d011-8f63-43f6-9ed8-4b444333a1d0/logo.svg?language=en-CA",
            "scu.png": "https://scu.mb.ca/getContentAsset/fe2b794e-3779-4199-839e-c1c500e5fd30/dfc3d011-8f63-43f6-9ed8-4b444333a1d0/favicon-32x32.png?language=en-CA",
            "beem.ico": "https://beemcreditunion.ca/favicon.ico?7212831dd4260413",
            "tru.svg": "https://www.trucooperativebank.ca/content/dam/trucooperativebank/images/logos/tcb/TCB-Favicon_32_BLCK-REV.svg",
            "truh.svg": "https://www.trucooperativebank.ca/content/dam/trucooperativebank/images/logos/tcb/TruCoopBank_Horz_BLK_RGB.svg"}
          for f, u in U.items():
              try:
                  r = requests.get(u, headers={"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36"}, timeout=30)
                  open("explore/" + f, "wb").write(r.content); print(f, r.status_code, r.headers.get("content-type"), len(r.content), r.headers.get("access-control-allow-origin"))
              except Exception as e:
                  print(f, "FAILED", e)
          PY
          git config user.name "rates-bot"; git config user.email "rates-bot@users.noreply.github.com"
          git checkout --orphan diagnose; git rm -rqf --cached .; git add explore
          git commit -qm "Lender pages"; git push -f origin diagnose
