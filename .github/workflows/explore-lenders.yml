name: Explore lender rate pages (temporary)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  explore:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium
      - name: Check new lenders
        run: |
          mkdir -p explore
          python - <<'PY' 2>&1 | tee explore/summary.txt
          import yaml, scraper
          NEW = ["Affinity Credit Union", "Conexus Credit Union", "Libro Credit Union", "FirstOntario Credit Union", "UNI Financial",
                 "ICICI Bank Canada", "Access Credit Union", "Assiniboine Credit Union", "Steinbach Credit Union", "Beem Credit Union", "Tru Cooperative Bank"]
          for l in yaml.safe_load(open("institutions.yaml")):
              if l["name"] not in NEW: continue
              res, err = scraper.scrape_lender(l)
              for k, v in res.items(): print(f"{l['name']} | {k} | {v[0]} | {v[1][:90]!r}")
              for k, v in err.items(): print(f"{l['name']} | {k} | ERROR {str(v)[:120]}")
              if l.get("mode") == "browser":
                  open(f"explore/{l['name'].split()[0].lower()}-browser.html", "w").write(scraper.get_html(l["url"], True))
          PY
          git config user.name "rates-bot"; git config user.email "rates-bot@users.noreply.github.com"
          git checkout --orphan diagnose; git rm -rqf --cached .; git add explore
          git commit -qm "Lender pages"; git push -f origin diagnose
