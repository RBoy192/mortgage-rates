name: Find rate data files (temporary)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  find:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Save samples
        run: |
          mkdir -p samples
          python - <<'PY' 2>&1 | tee samples/list.txt
          import re, time, backfill
          urls = {
            "tangerine": "https://www.tangerine.ca/content/dam/tangerine-shared/product-rates/currentRates.json",
            "td": "https://psservice.td.com/ca/en/carate/getRates",
            "cibc1": "https://www.cibconline.cibc.com/ebm-pno/api/v1/json/productRatesLegacy?lobId=1&sourceProductCode=PRIME%2c",
            "cibc5": "https://www.cibconline.cibc.com/ebm-pno/api/v1/json/productRatesLegacy?lobId=5&sourceProductCode=FRCM%2c5YRVARCLO%2cMICRO%2cFOM%2cMICROVAR%2cCCM%2cVROM%2c",
            "bmo_rates": "https://www.bmo.com/public-data/api/v2.0/bmo-ca-mortgages-rates.json",
            "bmo_epm": "https://www.bmo.com/public-data/api/epm/v1.0/bmo-epm-mortgage.json",
            "scotia_ns": "https://dmtsms.scotiabank.com/api/rates/daily/nonspecialmortgage",
            "scotia_var": "https://dmtsms.scotiabank.com/api/rates/daily/varmortgage",
          }
          for k, u in urls.items():
              rows = backfill.get(backfill.CDX, params={"url": u, "from": "20250101", "output": "json", "filter": "statuscode:200", "fl": "timestamp,original"}).json()[1:]
              days = sorted({r[0][:8] for r in rows})
              print(k, len(rows), "captures on", len(days), "days:", " ".join(d[2:] for d in days))
              if rows:
                  ts, orig = rows[-1]
                  body = backfill.get(f"https://web.archive.org/web/{ts}id_/{orig}").text
                  open(f"samples/{k}-{ts}.txt", "w").write(body)
              time.sleep(2)
          PY
          git config user.name "rates-bot"; git config user.email "rates-bot@users.noreply.github.com"
          git checkout --orphan diagnose; git rm -rqf --cached .; git add samples
          git commit -qm "Data file samples"; git push -f origin diagnose
