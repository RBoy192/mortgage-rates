name: Find rate data files (temporary)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  find:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium
      - name: Find
        run: |
          python - <<'PY' > found.txt 2>&1 || true
          import re, time, json, yaml, collections
          import backfill
          from playwright.sync_api import sync_playwright
          conf = {l["name"]: l for l in yaml.safe_load(open("institutions.yaml"))}
          banks = ["CIBC", "TD Canada Trust", "National Bank", "Scotiabank", "Tangerine", "RBC Royal Bank", "EQ Bank", "BMO", "Manulife Bank"]
          def cdx(url, extra=None, fl="timestamp,original,mimetype"):
              p = {"url": url, "from": "20251001", "to": "20261013", "output": "json", "filter": "statuscode:200", "collapse": "timestamp:8", "fl": fl}
              p.update(extra or {})
              try: return backfill.get(backfill.CDX, params=p).json()[1:]
              except Exception as e: return [["error", str(e)[:80], ""]]
          with sync_playwright() as pw:
              b = pw.chromium.launch()
              for name in banks:
                  url = conf[name]["url"]
                  snaps = cdx(url)
                  print(f"===== {name}: {len(snaps)} days with page copies since Oct 2025 ({url})")
                  if not snaps or snaps[0][0] == "error":
                      continue
                  ts, orig = snaps[-1][0], snaps[-1][1]
                  urls = set()
                  page = b.new_page()
                  def on_resp(resp, urls=urls):
                      rt = resp.request.resource_type
                      if rt in ("xhr", "fetch", "script", "document"):
                          m = re.search(r"/web/\d{14}[a-z_]*/(.*)", resp.url)
                          if m: urls.add((rt, m.group(1)))
                  page.on("response", on_resp)
                  try:
                      page.goto(f"https://web.archive.org/web/{ts}if_/{orig}", wait_until="domcontentloaded", timeout=60000)
                      page.wait_for_timeout(12000)
                  except Exception as e:
                      print("  replay failed", str(e)[:80])
                  page.close()
                  for rt, u in sorted(urls):
                      if rt == "script" and not re.search(r"rate|taux|mortgage|hypoth", u, re.I): continue
                      if re.search(r"analytics|gtm|tag|adobe|onetrust|cookie|font|\.css", u, re.I): continue
                      n = cdx(u)
                      print(f"  {rt:6} {len(n):4} days  {u[:160]}")
                      time.sleep(1)
              b.close()
          # moved pages: other mortgage-rate addresses on these sites
          for site in ("eqbank.ca", "bmo.com", "tangerine.ca", "td.com", "cibc.com", "nbc.ca", "scotiabank.com"):
              rows = cdx(f"{site}/*", {"filter": ["statuscode:200", "original:.*(mortgage-rate|mortgages/rates|mortgage_rate|taux-hypothecaires).*"], "collapse": "urlkey", "limit": "60"}, fl="original")
              print(f"===== other rate-page addresses on {site}:")
              for r in rows[:40]: print("   ", r[0][:150])
          PY
          cat found.txt
          git config user.name "rates-bot"; git config user.email "rates-bot@users.noreply.github.com"
          git checkout --orphan diagnose; git rm -rqf --cached .; git add found.txt
          git commit -qm "Rate data files"; git push -f origin diagnose
