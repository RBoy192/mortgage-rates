name: Survey archived rate pages (one-off)
# Started by hand. For each lender, counts the archived copies of its rate page per year and test-reads two
# copies a year with today's settings. Commits backfill/survey_report.csv for review; changes nothing else.
on:
  workflow_dispatch:
    inputs:
      years:
        description: "How many years back to look"
        default: "10"
permissions:
  contents: write
jobs:
  lender:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 4   # be gentle with the archive
      matrix:
        lender: ["RBC Royal Bank", "TD Canada Trust", "CIBC", "Scotiabank", "Tangerine", "National Bank", "EQ Bank", "BMO",
                 "ATB Financial", "Alterna Savings", "Coast Capital Savings", "Desjardins", "Servus Credit Union",
                 "Manulife Bank", "Vancity", "Meridian", "First National"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium
      - name: Survey archived copies
        run: python backfill.py --survey "${{ matrix.lender }}" "survey-${{ strategy.job-index }}.csv" "${{ inputs.years }}"
      - uses: actions/upload-artifact@v4
        with:
          name: survey-${{ strategy.job-index }}
          path: survey-${{ strategy.job-index }}.csv
  report:
    needs: lender
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: parts
          merge-multiple: true
      - name: Combine and commit the report
        run: |
          mkdir -p backfill
          first=1
          for f in parts/*.csv; do if [ $first = 1 ]; then cat "$f"; first=0; else tail -n +2 "$f"; fi; done > backfill/survey_report.csv
          git config user.name "rates-bot"
          git config user.email "rates-bot@users.noreply.github.com"
          git add backfill/survey_report.csv
          git commit -m "Archive survey report (for review)" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 10; done
