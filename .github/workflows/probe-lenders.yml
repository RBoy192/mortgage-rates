name: Probe lenders (temporary)
# Started by hand: reads the named lenders with the scraper and reports what it found as notes on the run. Changes nothing.
on:
  workflow_dispatch:
    inputs:
      lenders:
        description: 'Lender names, separated by commas'
        required: true
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium
      - name: Read the lenders
        env:
          LENDERS: ${{ inputs.lenders }}
        run: |
          python - <<'PY'
          import os, yaml, scraper
          names = [n.strip() for n in os.environ["LENDERS"].split(",")]
          for l in yaml.safe_load(open("institutions.yaml")):
              if l["name"] not in names: continue
              res, err = scraper.scrape_lender(l)
              msg = "; ".join(f"{p}={r[0]} [{r[1][:50]}]" for p, r in res.items()) + " || ERR: " + "; ".join(f"{p}: {str(e)[:80]}" for p, e in err.items())
              print(f"::notice title={l['name']}::{msg.replace(chr(10), ' ')[:3000]}")
          S = "https://online.simplii.com/ebm-pno/api/v2/json/rates/ALL"
          items = [{"product": f"{t}-year GIC", "json": {"rateProductCategory": "GIC", "registered": False, "rateType": "apy_rate", "term.value": t}, "field": "interestRates[tierTo=99999.99].rateValue"} for t in range(1, 6)]
          items.append({"product": "Savings", "json": {"rateProductCategory": "SAVINGS", "investment": True, "registered": False, "taxFree": False}, "field": "interestRates[tierFrom=0.00].rateValue"})
          from bs4 import BeautifulSoup
          res, err = scraper.scrape_page(S, "static", items, BeautifulSoup)
          print("::notice title=Simplii data file::" + "; ".join(f"{p}={r[0]}" for p, r in res.items()) + " || ERR: " + "; ".join(f"{p}: {str(e)[:120]}" for p, e in err.items()))
          PY
