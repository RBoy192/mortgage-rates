# Rates you type in by hand. They're used only when the automatic collection of that exact rate fails
# (or when a lender is set to  mode: manual  in institutions.yaml). An automatically collected rate always wins.
#
# Each entry needs the lender's name and product exactly as in institutions.yaml, the rate, and the date you checked it.
# A hand-entered rate older than 7 days is shown on the site as "Not refreshed", so update the date when you re-check.
#
# Example (remove the # signs to use it):
# - institution: BMO
#   product: 5-year fixed
#   rate: 5.14
#   checked: 2026-10-18
#   source: https://www.bmo.com/en-ca/main/personal/mortgages/mortgage-rates/

# BMO: "Special Rates" table, amortization 25 years or less. Read from the bank's page on 2026-10-19.
- institution: BMO
  product: 3-year fixed
  rate: 4.94
  checked: 2026-10-20
  source: https://www.bmo.com/en-ca/main/personal/mortgages/mortgage-rates/
- institution: BMO
  product: 5-year fixed
  rate: 5.14
  checked: 2026-10-20
  source: https://www.bmo.com/en-ca/main/personal/mortgages/mortgage-rates/
- institution: BMO
  product: 5-year variable
  rate: 4.10
  checked: 2026-10-20
  source: https://www.bmo.com/en-ca/main/personal/mortgages/mortgage-rates/

# CIBC: special-offer rates. Fixed from "CIBC Fixed-Rate Closed Mortgage"; variable is the 5-year "CIBC Variable Flex Mortgage". Read 2026-10-19.
- institution: CIBC
  product: 3-year fixed
  rate: 5.09
  checked: 2026-10-20
  source: https://www.cibc.com/en/interest-rates/mortgage-rates.html
- institution: CIBC
  product: 5-year fixed
  rate: 5.34
  checked: 2026-10-20
  source: https://www.cibc.com/en/interest-rates/mortgage-rates.html
- institution: CIBC
  product: 5-year variable
  rate: 4.20
  checked: 2026-10-20
  source: https://www.cibc.com/en/interest-rates/mortgage-rates.html

# Vancity: the site blocks automated visits (security checkpoint), so these are read by hand from its own page.
# Fixed rates are the "(special offer)" rows (20% or more down, home under $1 million). Read 2026-10-19.
- institution: Vancity
  product: 3-year fixed
  rate: 4.75
  checked: 2026-10-20
  source: https://www.vancity.com/rates/mortgages
  note: "Special offer: 20% or more down, home under $1 million"
- institution: Vancity
  product: 5-year fixed
  rate: 4.84
  checked: 2026-10-20
  source: https://www.vancity.com/rates/mortgages
  note: "Special offer: 20% or more down, home under $1 million"
- institution: Vancity
  product: 5-year variable
  rate: 3.95
  checked: 2026-10-20
  source: https://www.vancity.com/rates/mortgages

# Meridian: the site blocks automated visits, so these are read by hand from its own page.
# Fixed rates are the "Special offers" table; the variable is the "5-Year Closed" variable row (Prime - 0.81%). Read 2026-10-19.
- institution: Meridian
  product: 3-year fixed
  rate: 4.49
  checked: 2026-10-20
  source: https://www.meridiancu.ca/personal/rates-and-fees/mortgage-and-borrowing-rates
- institution: Meridian
  product: 5-year fixed
  rate: 4.74
  checked: 2026-10-20
  source: https://www.meridiancu.ca/personal/rates-and-fees/mortgage-and-borrowing-rates
- institution: Meridian
  product: 5-year variable
  rate: 3.64
  checked: 2026-10-20
  source: https://www.meridiancu.ca/personal/rates-and-fees/mortgage-and-borrowing-rates
