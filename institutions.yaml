# One entry per lender. Set enabled: false on any lender you want to pause.
#
#   mode: auto     (default) try the plain page first; if the rates aren't there, retry with a real browser
#   mode: static   plain page only (fastest)
#   mode: browser  real browser only, for pages that fill in their rates with JavaScript
#
# Each rate is found by its label, the text next to it on the page (for example "5 Year Fixed Closed").
#   label:  the text of the table cell or heading beside the rate
#   nth:    which % figure after the label to use (default 1). If the wrong number appears,
#           try 2 or 3. Many rows show the rate first, then APR or the posted rate.
#   after:  only look below the first place on the page that mentions this text (for pages that repeat a label)
#   occurrence:  use the 2nd, 3rd... appearance of the label instead of the 1st
#   publish: false   read and log this rate but don't show it on the site (handy for checking a new one)
#   enabled: false   switch off a single rate (or a whole lender)
#   column: for tables with terms across the top, the heading of the column to read (label then names the row)
#   prime_label: for rates shown as "P + 0.34%", the label of the lender's prime rate on the same page
#   mode: manual    don't fetch this lender; use only the rates typed into manual_rates.yaml
# Prefer a CSS selector instead? Use  selector: "..."  in place of label
# (find candidates with:  python scraper.py --inspect https://lender.example/rates).

- name: RBC Royal Bank
  url: https://www.rbcroyalbank.com/mortgages/mortgage-rates.html
  mode: auto
  rates:
    - product: 3-year fixed
      label: "3 Year Fixed Closed"
    - product: 5-year fixed
      label: "5 Year Fixed Closed"
    - product: 5-year variable
      label: "5 Year Variable Closed"
      nth: 2   # RBC's row reads "Prime -0.300% (4.150%)", so the rate is the 2nd % figure

- name: TD Canada Trust
  url: https://www.td.com/ca/en/personal-banking/products/mortgages/mortgage-rates
  mode: browser   # TD fills in its rates with JavaScript
  rates:
    - product: 3-year fixed
      label: "3 Year Fixed Closed"
    - product: 5-year fixed
      label: "5 Year Fixed Closed"
    - product: 5-year variable
      label: "5 Year Variable Closed"

# CIBC: permission received from the bank (October 2026). Special-offer fixed rates are in cards at the top;
# the 5-year variable is in the "CIBC Variable Flex Mortgage" table, which lists the posted rate first, then the special offer.
- name: CIBC
  url: https://www.cibc.com/en/interest-rates/mortgage-rates.html
  mode: manual   # the site blocks automated visits, so rates are typed into manual_rates.yaml (labels kept for if that changes)
  rates:
    - product: 3-year fixed
      label: "3-year fixed"
    - product: 5-year fixed
      label: "5-year fixed"
    - product: 5-year variable
      label: "5 years"
      after: "CIBC Variable Flex Mortgage"
      nth: 2

# Scotiabank's top table is its variable-rate section (Scotia Flex Value is a variable mortgage).
# For fixed terms the page only lists posted rates (no special offers), so those are labelled as such on the page.
# "3 years" and "5 years" also appear higher up the page, so those two start below the end of the top table.
- name: Scotiabank
  url: https://www.scotiabank.com/ca/en/personal/rates-prices/mortgages-rates.html
  mode: browser   # the rate tables load after the page opens
  rates:
    - product: 5-year variable
      label: "Scotia Flex Value Mortgage-Closed 5 Year Term"
    - product: 3-year fixed
      label: "3 years"
      after: "Scotia Flex Value Mortgage-Open 5 Year Term"
      note: "Posted rate"
    - product: 5-year fixed
      label: "5 years"
      after: "Scotia Flex Value Mortgage-Open 5 Year Term"
      note: "Posted rate"

- name: Tangerine
  url: https://www.tangerine.ca/en/rates/mortgage-rates
  mode: auto
  # Tangerine's page shows two rate tables with the same row labels and no heading to tell them apart.
  # This uses the first (the one shown by default). If it's the wrong one, add  occurrence: 2  to each rate.
  rates:
    - product: 3-year fixed
      label: "3 Year Fixed Mortgage"
    - product: 5-year fixed
      label: "5 Year Fixed Mortgage"
    - product: 5-year variable
      label: "5 Year Variable Mortgage"

- name: National Bank
  url: https://www.nbc.ca/personal/mortgages/rates.html
  mode: browser   # the page fills in most of its rates with JavaScript
  rates:
    - product: 3-year fixed
      label: "3 year fixed rate"
    - product: 5-year fixed
      label: "5 year fixed rate"
    - product: 5-year variable
      label: "5 year variable rate"

# EQ Bank: permission received from the bank (October 2026). Rates are in a table with terms across the top.
# The "Standard Mortgage Rate (Closed)" row is the rate for most borrowers (the Evolution Suite row is for insured
# mortgages only). The variable rate is shown as "P + 0.34%", so the scraper adds that to EQ's own prime rate.
- name: EQ Bank
  url: https://www.eqbank.ca/residential/mortgage-rates
  mode: auto
  rates:
    - product: 3-year fixed
      label: "Standard Mortgage Rate (Closed)"
      column: "3 Year Fixed"
      note: "Standard rate"
    - product: 5-year fixed
      label: "Standard Mortgage Rate (Closed)"
      column: "5 Year Fixed"
      note: "Standard rate"
    - product: 5-year variable
      label: "Standard Mortgage Rate (Closed)"
      column: "5 Year Adjustable"
      prime_label: "Equitable Prime Rate (P)"
      note: "Standard rate"

# BMO: permission received from the bank (October 2026). Uses the summary table lower on the page
# ("3 year fixed (closed)" and so on), where the first figure in each row is the rate and the second is the APR.
- name: BMO
  url: https://www.bmo.com/en-ca/main/personal/mortgages/mortgage-rates/
  mode: manual   # the site blocks automated visits, so rates are typed into manual_rates.yaml (labels kept for if that changes)
  rates:
    - product: 3-year fixed
      label: "3 year fixed (closed)"
    - product: 5-year fixed
      label: "5 year Smart Fixed (closed)"
    - product: 5-year variable
      label: "5 year Variable (closed)"

