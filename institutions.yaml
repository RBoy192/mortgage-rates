- name: Vancity
  url: https://www.vancity.com/rates/mortgages
  mode: manual   # the site blocks automated visits, so rates are typed into manual_rates.yaml (labels kept for if that changes)
  rates:
    - product: 3-year fixed
      label: "3-year fixed-term fixed-rate (special offer)"
      note: "Special offer: 20% or more down, home under $1 million"
    - product: 5-year fixed
      label: "5-year fixed-term fixed-rate (special offer)"
      note: "Special offer: 20% or more down, home under $1 million"
    - product: 5-year variable
      label: "5-year variable rate fixed-term (Vancity homeprime rate - 0.50%)"

# Meridian: special offers are in the "Special offers" table; the variable rows come after the posted
# fixed rates (the last of which is "10-Year Closed"), so the variable reads below that.
- name: Meridian
  url: https://www.meridiancu.ca/personal/rates-and-fees/mortgage-and-borrowing-rates
  mode: manual   # the site blocks automated visits, so rates are typed into manual_rates.yaml (labels kept for if that changes)
  rates:
    - product: 3-year fixed
      label: "3-Year Closed (special offer)"
    - product: 5-year fixed
      label: "5-Year Closed (special offer)"
    - product: 5-year variable
      label: "5-Year Closed"
      after: "10-Year Closed"

# First National: sells through mortgage brokers. Its tables list terms across the top and show rates without
# a % sign (plain: true). Uses the "Conventional" row (20% or more down). The variable rate is shown as
# "Prime - 0.31%", added to First National's own prime rate.
- name: First National
  url: https://www.firstnational.ca/mortgage-brokers/mortgage-rates/
  mode: auto
  rates:
    - product: 3-year fixed
      label: "Conventional"
      column: "3 year"
      plain: true
      note: "Through mortgage brokers"
    - product: 5-year fixed
      label: "Conventional"
      column: "5 year"
      plain: true
      note: "Through mortgage brokers"
    - product: 5-year variable
      label: "Conventional"
      column: "5 year"
      occurrence: 2   # the "Adjustable rate mortgages" table comes after the fixed-rate one
      prime_label: "First National Prime Rate"
      plain: true
      note: "Through mortgage brokers"

