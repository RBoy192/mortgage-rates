# Coast Capital: the "Fixed Rate Mortgages" and "Variable Rate Mortgages" tables (up to 25-year amortization column).
# The posted rates further down use labels ending in "- Closed", so they aren't picked up.
- name: Coast Capital Savings
  url: https://www.coastcapitalsavings.com/rates/mortgages
  mode: auto
  rates:
    - product: 3-year fixed
      label: "3-Year Fixed Rate"
    - product: 5-year fixed
      label: "5-Year Fixed Rate"
    - product: 5-year variable
      label: "5-Year Variable Rate"

# Desjardins: special rates are rows labelled "5 years (special rate)" in the fixed table, then again in the
# reduced variable-rate table (so the variable uses the 2nd appearance). There's no special 3-year rate.
- name: Desjardins
  url: https://www.desjardins.com/en/mortgage/mortgage-rates.html
  mode: auto
  rates:
    - product: 3-year fixed
      label: "3 years"
      note: "Standard rate"
    - product: 5-year fixed
      label: "5 years (special rate)"
    - product: 5-year variable
      label: "5 years (special rate)"
      occurrence: 2

# Servus: rows read "Term | Rate | Special Rate" (laid out in boxes, not a table), so the special rate is the 2nd figure.
# The "Servus No Frills Mortgage" table further down repeats the same labels, so reading stops before it.
# Servus doesn't list a variable rate.
- name: Servus Credit Union
  url: https://servus.ca/rates
  mode: auto
  rates:
    - product: 3-year fixed
      label: "3 Year"
      nth: 2
      after: "Fixed Rate Mortgages"
      before: "No Frills"
    - product: 5-year fixed
      label: "5 Year (Conventional)"
      nth: 2
      after: "Fixed Rate Mortgages"
      before: "No Frills"

# ---- Added October 2026: more banks and lenders. Each reads the lender's own public rate page. ----

# Manulife Bank: the fixed terms in the "Manulife Bank Select" table are its posted rates; its special
# "as low as" 5-year rates are in cards at the top (Manulife One first, then Manulife Bank Select, then high ratio).
- name: Manulife Bank
  url: https://manulifebank.ca/current-rates.html
  mode: auto
  rates:
    - product: 3-year fixed
      label: "3-year closed"
      after: "Manulife Bank Prime Rate"
      note: "Posted rate"
    - product: 5-year fixed
      label: "5-year closed fixed-rate"
      occurrence: 2   # the Manulife Bank Select Mortgage card
      note: "Special rate for new clients"
    - product: 5-year variable
      label: "5-year closed (Manulife Bank prime + 0.00%)"

